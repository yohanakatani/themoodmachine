[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep this to real correctness signals (unused/undefined names, syntax
# errors) rather than style preferences, since this is a student lab
# where the code is a work in progress.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# dataset.py / mood_analyzer.py / etc. live at the repo root, not inside
# a package, so add it to sys.path for `from dataset import ...` imports.
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Only report coverage for source files, not the test files themselves.
# main.py/ml_experiments.py are only exercised via test_smoke.py, which
# runs them in a subprocess -- coverage.py can't see across that process
# boundary, so they'll always show 0% here even though they're tested.
# That's a known, accepted gap in this report, not a real one.
omit = ["tests/*"]
